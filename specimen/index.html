:root {
  --ground: #121211;
  --stone: #181816;
  --bone: 229, 228, 224;
  --ink: rgba(var(--bone), .86);
  --ink-2: rgba(var(--bone), .6);   /* 4.9:1 on the ground: the floor for small text */
  --hair: rgba(var(--bone), .08);
  --hair-2: rgba(var(--bone), .2);
  --ease: cubic-bezier(.16, 1, .3, 1);
  --edge: clamp(20px, 3.2vw, 44px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 400 11px/1.6 "Plex Mono", ui-monospace, monospace;
  letter-spacing: .14em;
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(var(--bone), .82); color: var(--ground); }
:focus-visible { outline: 1px solid rgba(var(--bone), .55); outline-offset: 4px; }

/* The specimen fills the sheet; the ledger sits on top of it. */
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
canvas.dragging { cursor: grabbing; }
canvas:focus-visible { outline: none; }

.sheet {
  position: fixed; inset: 0; pointer-events: none;
  display: grid; grid-template-rows: 1fr auto;
  padding: var(--edge);
}
.sheet > * { pointer-events: auto; }

/* The title hangs in the upper third, directly above the specimen, quiet enough to sit in the scene. */
.title { position: fixed; left: 50%; top: max(var(--edge), 13vh); transform: translateX(-50%); text-align: center; pointer-events: none; white-space: nowrap; }
h1 { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: .42em; margin-right: -.42em; color: rgba(var(--bone), .55); }
.title p { margin: 10px 0 0; font-size: 10px; letter-spacing: .3em; margin-right: -.3em; color: rgba(var(--bone), .4); }

footer { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 24px; padding-top: 14px; border-top: 1px solid var(--hair); }
.edge { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--ink-2); }
.edge b { font-weight: 400; color: var(--ink); margin-left: 8px; }

.scale { justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--ink-2); }
.scale i { display: block; height: 5px; border: 1px solid var(--hair-2); border-top: 0; }

/* Cursor probe: position and the pixel under the pointer, read back from the canvas. */
.probe { position: fixed; left: 0; top: 0; pointer-events: none; font-size: 10px; letter-spacing: .12em; color: rgba(var(--bone), .66); white-space: pre; padding: 3px 7px; background: rgba(18, 18, 17, .78); opacity: 0; transition: opacity .5s var(--ease); will-change: transform; }
.probe.on { opacity: 1; }
.probe i { font-style: normal; display: inline-block; width: 7px; height: 7px; margin-left: 8px; border: 1px solid var(--hair-2); vertical-align: -1px; }

.controls { display: flex; gap: 8px; justify-self: end; }
button {
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink-2);
  background: rgba(var(--bone), 0);
  border: 1px solid var(--hair);
  height: 34px; padding: 0 14px;
  display: inline-flex; align-items: center; gap: 10px;
  cursor: pointer;
  box-shadow: inset 0 0 0 0 rgba(0, 0, 0, 0), 0 0 0 0 rgba(var(--bone), 0);
  transition: color .3s var(--ease), border-color .3s var(--ease), background-color .3s var(--ease), box-shadow .3s var(--ease), transform .3s var(--ease);
}
button:hover { color: var(--ink); border-color: var(--hair-2); background: rgba(var(--bone), .025); }
/* Press: a mechanical depress. Fast in (150ms), the release feathers back out on the hover curve. */
button:active {
  transform: scale(.96);
  background: rgba(var(--bone), .015);
  box-shadow: inset 0 1px 5px 0 rgba(0, 0, 0, .55), 0 0 0 0 rgba(var(--bone), 0);
  transition-duration: .15s;
}
/* After a click, a faint glow dissipates from the frame. */
button.pulse { animation: pulse .7s var(--ease); }
@keyframes pulse { 0% { box-shadow: inset 0 0 0 0 rgba(0,0,0,0), 0 0 0 3px rgba(var(--bone), .07); border-color: rgba(var(--bone), .34); } 100% { box-shadow: inset 0 0 0 0 rgba(0,0,0,0), 0 0 0 9px rgba(var(--bone), 0); } }

.glyph { width: 10px; height: 10px; flex: none; }
.ticks { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
.ticks b { width: 2px; background: var(--hair-2); transition: background-color .3s var(--ease); }
.ticks b:nth-child(1) { height: 4px; } .ticks b:nth-child(2) { height: 7px; } .ticks b:nth-child(3) { height: 10px; }
.ticks b.on { background: rgba(var(--bone), .7); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 760px) {
  footer { grid-template-columns: 1fr; gap: 14px; }
  .scale, .edge .hint, .probe { display: none; }
  .title { top: max(var(--edge), 9vh); }
  .controls { justify-content: stretch; justify-self: stretch; }
  .controls button { flex: 1; justify-content: center; padding: 0 8px; gap: 8px; white-space: nowrap; letter-spacing: .1em; }
  .controls .glyph { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  button, button:active, .ticks b, .probe { transition-duration: 0s !important; }
  button.pulse { animation: none; }
}
</style>
</head>
<body>
<canvas id="specimen" tabindex="0" role="img" aria-label="Rotating wireframe of a housefly, Musca domestica. Drag, or use the arrow keys, to turn it."></canvas>

<div class="title">
  <h1>Musca domestica</h1>
  <p>Specimen // No. 01 · Diptera, Muscidae</p>
</div>

<output class="probe" id="probe" aria-hidden="true"></output>

<div class="sheet">
  <div></div>
  <footer>
    <p class="edge" aria-live="off">
      <span>Rot<b id="r-yaw">0.0°</b></span><span>Pitch<b id="r-pitch">+0.0°</b></span><span>Edges<b id="r-edges">0</b></span><span class="hint">Drag to turn</span>
    </p>

    <div class="scale" aria-hidden="true"><i id="scale-bar"></i><span>1 mm</span></div>

    <div class="controls">
      <button type="button" id="b-run" aria-pressed="false">
        <svg class="glyph" viewBox="0 0 10 10" aria-hidden="true"><g id="g-run" fill="currentColor"><rect x="2" y="1.5" width="1.6" height="7"/><rect x="6.4" y="1.5" width="1.6" height="7"/></g></svg>
        <span id="l-run">Pause</span>
      </button>
      <button type="button" id="b-density" aria-describedby="d-density">
        <span class="ticks" aria-hidden="true"><b></b><b></b><b></b></span>
        <span>Density</span><span class="sr-only" id="d-density">level 2 of 3</span>
      </button>
      <button type="button" id="b-reset">
        <svg class="glyph" viewBox="0 0 10 10" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M2.2 3.4A3.4 3.4 0 1 1 1.6 6"/><path d="M1.8 1v2.6h2.6"/></svg>
        <span>Reset view</span>
      </button>
    </div>
  </footer>
</div>

<script>
(() => {
  'use strict';
  // ---------- Geometry: a housefly in millimetres. +x right, +y up, +z toward the head. ----------
  // Every edge is [x1, y1, z1, x2, y2, z2, weight]; weight scales the line's opacity (membrane < body < segment rims).
  const TAU = Math.PI * 2;

  function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }

  function buildFly(level) {
    const E = [];
    const seg = (a, b, w = 1) => E.push([a[0], a[1], a[2], b[0], b[1], b[2], w]);
    const line = (pts, w = 1, closed = false) => { for (let i = 1; i < pts.length; i++) seg(pts[i - 1], pts[i], w); if (closed) seg(pts[pts.length - 1], pts[0], w); };
    const mirror = p => [-p[0], p[1], p[2]];
    const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
    const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
    const len = a => Math.hypot(a[0], a[1], a[2]);
    const norm = a => mul(a, 1 / (len(a) || 1));
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const lerp = (a, b, t) => add(a, mul(sub(b, a), t));
    const L = level;                       // 1 sparse, 2 standard, 3 dense + setae
    const ring = [12, 20, 32][L - 1];

    // Ellipsoid as rings around its long axis (z) and meridians along it: reads like a lofted body.
    function ellipsoid(c, r, rings, meridians, w = 1) {
      const pt = (phi, th) => [c[0] + r[0] * Math.cos(phi) * Math.cos(th), c[1] + r[1] * Math.cos(phi) * Math.sin(th), c[2] + r[2] * Math.sin(phi)];
      for (let i = 1; i < rings; i++) {
        const phi = -Math.PI / 2 + Math.PI * i / rings, pts = [];
        for (let k = 0; k < ring; k++) pts.push(pt(phi, TAU * k / ring));
        line(pts, w, true);
      }
      for (let j = 0; j < meridians; j++) {
        const th = TAU * j / meridians, pts = [];
        for (let k = 0; k <= ring / 2; k++) pts.push(pt(-Math.PI / 2 + Math.PI * k / (ring / 2), th));
        line(pts, w * .8);
      }
    }

    // Icosphere: the compound eye's facets.
    function icosphere(c, r, detail, w = 1) {
      const t = (1 + Math.sqrt(5)) / 2;
      let v = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]].map(norm);
      let f = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8], [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
      for (let d = 0; d < detail; d++) {
        const cache = new Map(), nf = [];
        const mid = (a, b) => { const k = a < b ? a + '_' + b : b + '_' + a; if (!cache.has(k)) { cache.set(k, v.length); v.push(norm(lerp(v[a], v[b], .5))); } return cache.get(k); };
        for (const [a, b, cc] of f) { const ab = mid(a, b), bc = mid(b, cc), ca = mid(cc, a); nf.push([a, ab, ca], [b, bc, ab], [cc, ca, bc], [ab, bc, ca]); }
        f = nf;
      }
      const seen = new Set(), P = v.map(p => [c[0] + p[0] * r[0], c[1] + p[1] * r[1], c[2] + p[2] * r[2]]);
      for (const tri of f) for (let i = 0; i < 3; i++) {
        const a = tri[i], b = tri[(i + 1) % 3], k = a < b ? a + '_' + b : b + '_' + a;
        if (!seen.has(k)) { seen.add(k); seg(P[a], P[b], w); }
      }
    }

    // A small ring perpendicular to a direction: joints, the labellum, haltere knobs.
    function hoop(c, dir, r, n, w) {
      const d = norm(dir), u = norm(cross(d, Math.abs(d[1]) > .9 ? [1, 0, 0] : [0, 1, 0])), v = cross(d, u), pts = [];
      for (let k = 0; k < n; k++) { const a = TAU * k / n; pts.push(add(c, add(mul(u, Math.cos(a) * r), mul(v, Math.sin(a) * r)))); }
      line(pts, w, true);
    }

    // A tube through joint points: leg segments as thin wire cylinders with rims at each joint.
    function tube(joints, radii, sides, w) {
      const rims = joints.map((p, i) => {
        const d = norm(sub(joints[Math.min(i + 1, joints.length - 1)], joints[Math.max(i - 1, 0)]));
        const u = norm(cross(d, Math.abs(d[1]) > .9 ? [1, 0, 0] : [0, 1, 0])), v = cross(d, u);
        return Array.from({ length: sides }, (_, k) => { const a = TAU * k / sides; return add(p, add(mul(u, Math.cos(a) * radii[i]), mul(v, Math.sin(a) * radii[i]))); });
      });
      rims.forEach((rim, i) => { if (i > 0 && i < rims.length - 1 || L > 1) line(rim, w, true); });
      for (let k = 0; k < sides; k++) line(rims.map(r => r[k]), w * .85);
    }

    // ---- Head: a wide capsule, the two faceted eyes, antennae, proboscis.
    ellipsoid([0, .2, 2.7], [1.2, 1.0, .68], [5, 7, 9][L - 1], [8, 12, 16][L - 1], .9);
    for (const s of [1, -1]) icosphere([.8 * s, .34, 2.84], [.6, .84, .56], [1, 2, 3][L - 1], .75);
    for (const s of [1, -1]) {
      const a0 = [.16 * s, .62, 3.28], a1 = [.24 * s, .52, 3.52], a2 = [.3 * s, .2, 3.6];
      line([a0, a1, a2], 1.1); hoop(a2, sub(a2, a1), .07, 6, .8);
      line([a2, [.52 * s, .5, 3.82], [.62 * s, .86, 3.86]], .55);          // arista
    }
    const pr = [[0, -.36, 3.0], [0, -.86, 3.22], [0, -1.28, 3.18]];
    tube(pr, [.13, .11, .09], [4, 5, 6][L - 1], .9);
    hoop([0, -1.34, 3.18], [0, 1, 0], .3, 12, 1); hoop([0, -1.34, 3.18], [0, 1, 0], .18, 10, .7);

    // ---- Thorax: domed, with a scutellum over the wing roots.
    ellipsoid([0, .32, 1.0], [1.12, 1.05, 1.42], [7, 9, 13][L - 1], [10, 14, 20][L - 1], 1);
    ellipsoid([0, 1.12, -.2], [.62, .28, .42], [3, 4, 6][L - 1], [6, 8, 12][L - 1], .8);

    // ---- Abdomen: five tergites, lofted. Segment rims are heavier than the in-between rings.
    const S = [[-.25, .78, .68, .2], [-.95, 1.24, .98, .12], [-1.75, 1.34, 1.02, .06], [-2.55, 1.2, .9, .02], [-3.25, .86, .66, .0], [-3.72, .32, .28, .02], [-3.86, .02, .02, .04]];
    const steps = [1, 2, 3][L - 1];
    const prof = [];
    for (let i = 0; i < S.length - 1; i++) for (let k = 0; k < steps; k++) {
      const t = k / steps, a = S[i], b = S[i + 1], e = t * t * (3 - 2 * t);
      prof.push({ z: a[0] + (b[0] - a[0]) * t, rx: a[1] + (b[1] - a[1]) * e, ry: a[2] + (b[2] - a[2]) * e, y: a[3] + (b[3] - a[3]) * t, rim: k === 0 });
    }
    prof.push({ z: S.at(-1)[0], rx: S.at(-1)[1], ry: S.at(-1)[2], y: S.at(-1)[3], rim: true });
    const ab = prof.map(p => Array.from({ length: ring }, (_, k) => { const a = TAU * k / ring; return [p.rx * Math.cos(a), p.y + p.ry * Math.sin(a), p.z]; }));
    ab.forEach((r, i) => { if (prof[i].rx > .05) line(r, prof[i].rim ? 1.15 : .55, true); });
    const lon = [8, 12, 16][L - 1];
    for (let k = 0; k < lon; k++) line(ab.map(r => r[Math.round(k * ring / lon) % ring]), .7);

    // ---- Wings: membrane outline, five veins fanned from the root, cross-veins, and at density 3 a fine lattice.
    function wing(s) {
      const root = [.56 * s, 1.22, 1.3];
      const d = norm([.5 * s, -.1, -1]);                     // spread back and out
      const across = norm(cross([0, 1, 0], d));               // in-plane, perpendicular to the span
      const lift = norm(cross(d, across));
      const WL = 5.6, WW = 2.0;
      const P = (u, t) => { // u along the span 0..1, t across -1..1 (leading edge +)
        const half = WW * .5 * Math.pow(Math.sin(Math.PI * Math.min(1, u * .96 + .04)), .62) * (1 - .18 * u);
        const sag = -.35 * u * u - .12 * Math.abs(t) * u;     // tip droops, edges curl
        return add(root, add(mul(d, WL * u), add(mul(across, -half * t * s), mul(lift, sag + .05 * t))));
      };
      const n = [24, 36, 56][L - 1], out = [];
      for (let k = 0; k <= n; k++) out.push(P(k / n, 1));
      for (let k = n; k >= 0; k--) out.push(P(k / n, -1));
      line(out, .7, true);
      const veins = [.78, .42, .08, -.3, -.66];
      const vein = t => { const pts = []; for (let k = 0; k <= n; k++) { const u = k / n * (.98 - .06 * Math.abs(t)); pts.push(P(u, t * Math.min(1, .25 + u * 1.4))); } return pts; };
      veins.forEach(t => line(vein(t), .62));
      for (const [u, a, b] of [[.36, .42, .08], [.58, .08, -.3], [.7, -.3, -.66]]) line([P(u, a * Math.min(1, .25 + u * 1.4)), P(u + .03, b * Math.min(1, .25 + (u + .03) * 1.4))], .62);
      const lat = [0, 6, 14][L - 1];                         // translucent lattice
      for (let i = 1; i <= lat; i++) { const u = i / (lat + 1), pts = []; for (let k = 0; k <= 12; k++) pts.push(P(u, -1 + 2 * k / 12)); line(pts, .28); }
      if (L === 3) for (let i = 1; i < 10; i++) { const t = -1 + i / 5, pts = []; for (let k = 2; k <= n; k++) pts.push(P(k / n, t)); line(pts, .2); }
      // haltere: stalk and knob behind the wing
      const h0 = [.62 * s, .86, .08], h1 = [.84 * s, .62, -.18];
      line([h0, h1], .9); icosphere(h1, [.1, .1, .1], 1, .7);
    }
    wing(1); wing(-1);

    // ---- Legs: coxa, femur, tibia, five tarsomeres, two claws. Angular, as a pinned specimen holds them.
    const legs = [
      [[.5, -.42, 1.85], [.66, -1.0, 2.2], [1.55, -.62, 3.0], [1.86, -2.0, 3.6], [2.06, -2.26, 4.42]],
      [[.66, -.55, 1.05], [.92, -1.04, 1.1], [2.38, -.46, 1.02], [3.0, -2.0, .8], [3.64, -2.26, .66]],
      [[.6, -.5, .32], [.86, -1.0, .02], [1.98, -.52, -1.28], [2.48, -2.0, -2.4], [2.8, -2.26, -3.24]],
    ];
    const sides = [3, 4, 6][L - 1];
    for (const leg of legs) for (const s of [1, -1]) {
      const J = leg.map(p => s > 0 ? p : mirror(p));
      tube(J.slice(0, 4), [.12, .11, .085, .06], sides, .85);
      const t0 = J[3], t1 = J[4], tars = [];
      for (let k = 0; k <= 5; k++) tars.push(lerp(t0, t1, k / 5));
      line(tars, .9);
      if (L > 1) for (let k = 1; k < 5; k++) hoop(tars[k], sub(t1, t0), .045, 5, .6);
      const dir = norm(sub(t1, t0)), side = norm(cross(dir, [0, 1, 0]));
      seg(t1, add(add(t1, mul(dir, .16)), mul(side, .09)), .8);
      seg(t1, add(add(t1, mul(dir, .16)), mul(side, -.09)), .8);
    }

    // ---- Setae (density 3): short bristles along the thorax and abdomen normals.
    if (L === 3) {
      const r = rng(7);
      for (let i = 0; i < 140; i++) {
        const phi = (r() * .9 + .05) * Math.PI / 2, th = (r() * .8 + .1) * Math.PI, onThorax = i < 90;
        const c = onThorax ? [0, .32, 1.0] : [0, .08, -1.8], R = onThorax ? [1.12, 1.05, 1.42] : [1.3, 1.0, 1.6];
        const n0 = [Math.cos(phi) * Math.cos(th), Math.sin(th) * Math.cos(phi) * .2 + Math.sin(phi) * .98, Math.cos(phi) * Math.sin(th) * .6 - .3];
        const p = [c[0] + R[0] * Math.cos(th) * Math.cos(phi), c[1] + R[1] * Math.sin(phi), c[2] + R[2] * (r() * 1.4 - .7)];
        seg(p, add(p, mul(norm(add(n0, [0, 0, -.6])), .28 + r() * .26)), .5);
      }
    }

    // Centre the specimen on its own bounds.
    let mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
    for (const e of E) for (let o = 0; o < 6; o += 3) for (let a = 0; a < 3; a++) { mn[a] = Math.min(mn[a], e[o + a]); mx[a] = Math.max(mx[a], e[o + a]); }
    const c = mul(add(mn, mx), .5);
    const out = new Float32Array(E.length * 8);
    E.forEach((e, i) => {
      for (let a = 0; a < 3; a++) { out[i * 8 + a] = e[a] - c[a]; out[i * 8 + 3 + a] = e[3 + a] - c[a]; }
      out[i * 8 + 6] = e[6];
      // reveal order: distance of the edge's midpoint from the thorax, so the wire draws outward from the body
      const m = [(e[0] + e[3]) / 2, (e[1] + e[4]) / 2, (e[2] + e[5]) / 2];
      out[i * 8 + 7] = Math.min(1, Math.hypot(m[0], m[1] - .3, m[2] - 1) / 6.2);
    });
    return { edges: out, count: E.length, radius: Math.max(...mx.map((v, a) => v - c[a])) };
  }

  // ---------- Rendering ----------
  const canvas = document.getElementById('specimen');
  const ctx = canvas.getContext('2d', { alpha: false });
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const A_NEAR = .42, A_FAR = .04, BUCKETS = 26, LIFT = 1.3, A_MAX = A_NEAR * 1.15 * (1 + LIFT);   // 1.15: heaviest edge weight; LIFT: extra light near the cursor
  const DEFAULT = { yaw: -.62, pitch: .32 };

  const state = {
    level: 2, fly: null,
    running: !reduce.matches,
    yaw: DEFAULT.yaw, pitch: DEFAULT.pitch,
    yawVel: 0, pitchVel: 0,                 // drag inertia
    userPitch: 0,
    par: [0, 0], parTarget: [0, 0],         // cursor parallax, eased
    reset: null,                             // { from, to, t0 }
    reveal: reduce.matches ? 1 : 0, t: 0,
    light: { x: 0, y: 0, tx: 0, ty: 0, on: 0, onT: 0 },   // cursor spotlight, eased
  };
  state.fly = buildFly(state.level);

  let W = 0, H = 0, dpr = 1, scale = 1;
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = Math.min(W * .78, H * .66) / (state.fly.radius * 2);   // px per mm at the centre plane
    $('scale-bar').style.width = scale.toFixed(1) + 'px';
  }
  addEventListener('resize', resize);

  const CAM = 26;   // camera distance in mm: a long lens, gentle perspective
  const paths = Array.from({ length: BUCKETS }, () => new Path2D());
  function draw() {
    const { edges, count, radius } = state.fly;
    const yaw = state.yaw + state.par[0], pitch = state.pitch + state.userPitch + state.par[1];
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const cx0 = W / 2, cy0 = H * .53, f = scale * CAM;
    const ease = 1 - Math.pow(1 - Math.min(1, state.reveal), 4);

    ctx.fillStyle = '#121211'; ctx.fillRect(0, 0, W, H);
    // Spotlight: a soft luminosity lift of the ground around the pointer (about +10% at its centre).
    const L = state.light, R = Math.max(W, H) * .26, s2 = 2 * (R * .42) ** 2;
    if (L.on > .002) {
      const g = ctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, R);
      g.addColorStop(0, `rgba(229,228,224,${(.056 * L.on).toFixed(4)})`);
      g.addColorStop(.45, `rgba(229,228,224,${(.022 * L.on).toFixed(4)})`);
      g.addColorStop(1, 'rgba(229,228,224,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    for (let b = 0; b < BUCKETS; b++) paths[b] = new Path2D();

    for (let i = 0; i < count; i++) {
      const o = i * 8, w = edges[o + 6];
      const vis = Math.min(1, Math.max(0, (ease * 1.25 - edges[o + 7]) * 5));
      if (vis <= 0) continue;
      // rotate both ends: yaw about y, then pitch about x
      let x1 = edges[o] * cy + edges[o + 2] * sy, z1 = -edges[o] * sy + edges[o + 2] * cy, y1 = edges[o + 1];
      let x2 = edges[o + 3] * cy + edges[o + 5] * sy, z2 = -edges[o + 3] * sy + edges[o + 5] * cy, y2 = edges[o + 4];
      const Y1 = y1 * cp - z1 * sp, Z1 = y1 * sp + z1 * cp, Y2 = y2 * cp - z2 * sp, Z2 = y2 * sp + z2 * cp;
      // depth falloff: the near side of the fly holds the light, the far side fades to smoke
      const depth = ((Z1 + Z2) / 2 + radius) / (2 * radius);
      const k1 = f / (CAM - Z1), k2 = f / (CAM - Z2);
      const sx1 = cx0 + x1 * k1, sy1 = cy0 - Y1 * k1, sx2 = cx0 + x2 * k2, sy2 = cy0 - Y2 * k2;
      let a = (A_FAR + (A_NEAR - A_FAR) * Math.pow(Math.min(1, Math.max(0, depth)), 1.5)) * w * vis;
      // wire near the cursor catches the light
      if (L.on > .002) { const dx = (sx1 + sx2) / 2 - L.x, dy = (sy1 + sy2) / 2 - L.y; a *= 1 + LIFT * L.on * Math.exp(-(dx * dx + dy * dy) / s2); }
      const b = Math.min(BUCKETS - 1, Math.floor(a / A_MAX * BUCKETS));
      if (b < 0) continue;
      paths[b].moveTo(sx1, sy1);
      paths[b].lineTo(sx2, sy2);
    }
    ctx.lineWidth = .7; ctx.lineCap = 'round';
    for (let b = 0; b < BUCKETS; b++) {
      ctx.strokeStyle = `rgba(229,228,224,${((b + .5) / BUCKETS * A_MAX).toFixed(3)})`;
      ctx.stroke(paths[b]);
    }
  }

  // ---------- Motion ----------
  const SPIN = .16;            // rad/s: one turn in about 39 seconds
  let last = performance.now(), lastReadout = 0, dragging = false;
  const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; state.t += dt;
    if (state.reveal < 1) state.reveal = Math.min(1, state.reveal + dt / 2.2);
    if (state.reset) {
      const { from, to, t0 } = state.reset, p = Math.min(1, (now - t0) / 1100), e = 1 - Math.pow(1 - p, 4);
      state.yaw = from.yaw + (to.yaw - from.yaw) * e; state.userPitch = from.userPitch * (1 - e);
      state.pitch = DEFAULT.pitch;
      if (p >= 1) state.reset = null;
    } else {
      if (state.running && !dragging) state.yaw += SPIN * dt;
      // the slow nod on X
      if (state.running) state.pitch = DEFAULT.pitch + .12 * Math.sin(state.t * .27);
      if (!dragging) {
        state.yaw += state.yawVel * dt; state.userPitch += state.pitchVel * dt;
        const damp = Math.exp(-dt * 2.6); state.yawVel *= damp; state.pitchVel *= damp;
      }
      state.userPitch = Math.max(-.9, Math.min(.9, state.userPitch));
    }
    // cursor parallax with inertia
    const k = 1 - Math.exp(-dt * 2.2);
    state.par[0] += (state.parTarget[0] - state.par[0]) * k;
    state.par[1] += (state.parTarget[1] - state.par[1]) * k;
    const Lt = state.light, kl = 1 - Math.exp(-dt * 9), ko = 1 - Math.exp(-dt * 3.5);
    Lt.x += (Lt.tx - Lt.x) * kl; Lt.y += (Lt.ty - Lt.y) * kl; Lt.on += (Lt.onT - Lt.on) * ko;
    draw();
    if (now - lastReadout > 100) { lastReadout = now; readout(); probe(); }
    requestAnimationFrame(frame);
  }

  function readout() {
    const yawDeg = ((((state.yaw + state.par[0]) * 180 / Math.PI) % 360) + 360) % 360;
    const pitchDeg = (state.pitch + state.userPitch + state.par[1]) * 180 / Math.PI;
    $('r-yaw').textContent = yawDeg.toFixed(1).padStart(5, ' ') + '°';
    $('r-pitch').textContent = (pitchDeg >= 0 ? '+' : '−') + Math.abs(pitchDeg).toFixed(1) + '°';
    $('r-edges').textContent = state.fly.count.toLocaleString('en-US');
  }

  // ---------- Cursor probe: pixel position and the colour actually on the canvas under it ----------
  const probeEl = $('probe');
  let pointer = null;
  function probe() {
    if (!pointer) return;
    const [r, g, b] = ctx.getImageData(Math.min(canvas.width - 1, Math.round(pointer.x * dpr)), Math.min(canvas.height - 1, Math.round(pointer.y * dpr)), 1, 1).data;
    const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
    const pad = v => String(Math.round(v)).padStart(4, '0');
    probeEl.innerHTML = `X: ${pad(pointer.x)}  Y: ${pad(pointer.y)}  |  PX_VAL: ${hex}<i style="background:${hex}"></i>`;
  }
  function placeProbe() {
    const w = probeEl.offsetWidth || 260, h = probeEl.offsetHeight || 14;
    const x = pointer.x + 18 + w > W - 12 ? pointer.x - 18 - w : pointer.x + 18;
    const y = pointer.y + 22 + h > H - 12 ? pointer.y - 22 - h : pointer.y + 22;
    probeEl.style.transform = `translate(${x}px, ${y}px)`;
  }

  // ---------- Input ----------
  addEventListener('pointermove', e => {
    pointer = { x: e.clientX, y: e.clientY };
    const L = state.light; L.tx = e.clientX; L.ty = e.clientY; L.onT = 1;
    if (L.on < .01) { L.x = L.tx; L.y = L.ty; }        // appear where the pointer is, not slide in from elsewhere
    if (e.pointerType === 'mouse') { probeEl.classList.add('on'); placeProbe(); }
    if (reduce.matches) return;
    state.parTarget = [(e.clientX / W - .5) * .42, (e.clientY / H - .5) * .22];
  });
  const leave = () => { state.parTarget = [0, 0]; state.light.onT = 0; probeEl.classList.remove('on'); pointer = null; };
  document.documentElement.addEventListener('pointerleave', leave);
  addEventListener('blur', leave);
  addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') { state.light.onT = 0; } });
  let px = 0, py = 0, pt = 0;
  canvas.addEventListener('pointerdown', e => {
    dragging = true; state.reset = null; px = e.clientX; py = e.clientY; pt = performance.now();
    state.yawVel = state.pitchVel = 0; canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', e => {
    if (!dragging) return;
    const now = performance.now(), dt = Math.max(.008, (now - pt) / 1000);
    const dx = (e.clientX - px) * .0085, dy = (e.clientY - py) * .0065;
    state.yaw += dx; state.userPitch = Math.max(-.9, Math.min(.9, state.userPitch + dy));
    state.yawVel = state.yawVel * .6 + dx / dt * .4; state.pitchVel = state.pitchVel * .6 + dy / dt * .4;
    px = e.clientX; py = e.clientY; pt = now;
  });
  const endDrag = () => { dragging = false; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('keydown', e => {
    const step = e.shiftKey ? .35 : .12;
    if (e.key === 'ArrowLeft') state.yaw -= step; else if (e.key === 'ArrowRight') state.yaw += step;
    else if (e.key === 'ArrowUp') state.userPitch = Math.max(-.9, state.userPitch - step);
    else if (e.key === 'ArrowDown') state.userPitch = Math.min(.9, state.userPitch + step);
    else return;
    state.reset = null; e.preventDefault();
  });

  // ---------- Controls ----------
  function pulse(btn) { btn.classList.remove('pulse'); void btn.offsetWidth; btn.classList.add('pulse'); }
  function syncRun() {
    $('b-run').setAttribute('aria-pressed', String(!state.running));
    $('l-run').textContent = state.running ? 'Pause' : 'Run';
    $('g-run').innerHTML = state.running
      ? '<rect x="2" y="1.5" width="1.6" height="7"/><rect x="6.4" y="1.5" width="1.6" height="7"/>'
      : '<path d="M2.5 1.5 8.5 5 2.5 8.5z"/>';
  }
  function syncDensity() {
    document.querySelectorAll('.ticks b').forEach((b, i) => b.classList.toggle('on', i < state.level));
    $('d-density').textContent = `level ${state.level} of 3`;
  }
  $('b-run').addEventListener('click', e => { state.running = !state.running; syncRun(); pulse(e.currentTarget); });
  $('b-density').addEventListener('click', e => {
    state.level = state.level % 3 + 1; state.fly = buildFly(state.level);
    if (!reduce.matches) state.reveal = .2;   // the new wire draws out from the body
    syncDensity(); resize(); readout(); pulse(e.currentTarget);
  });
  $('b-reset').addEventListener('click', e => {
    // land on the default pose by the shortest way round
    state.reset = { from: { yaw: state.yaw, userPitch: state.userPitch }, to: { yaw: state.yaw - wrap(state.yaw - DEFAULT.yaw) }, t0: performance.now() };
    state.yawVel = state.pitchVel = 0; state.parTarget = [0, 0];
    pulse(e.currentTarget);
  });
  reduce.addEventListener('change', () => { if (reduce.matches) { state.running = false; state.parTarget = [0, 0]; state.reveal = 1; syncRun(); } });

  syncRun(); syncDensity(); resize(); readout();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
